version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: dentalsoft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-DentalSoftRoot2026}
      MYSQL_DATABASE: dentalSoftDB
      MYSQL_USER: ${MYSQL_USER:-dentalsoft_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-DentalSoftPass2026}
      TZ: Africa/Casablanca
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - dentalsoft_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: dentalsoft-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  dentalsoft_mysql_data:

