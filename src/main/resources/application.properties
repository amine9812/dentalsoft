# =============================================================================
# Projet      : DentalSoft V1.0 - Cabinet Dentaire YOU SMILE
# Fichier     : application.properties.example
# Description : Modele de configuration externe pour la connexion JDBC MySQL
#               Conformite : BNF-02 (Protection des secrets) et BNF-08
# =============================================================================

# Parametres de connexion MySQL 8.0+
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/dentalSoftDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca&characterEncoding=UTF-8
db.username=dentalsoft_user
db.password=CHANGER_MOT_DE_PASSE

# Parametres d'initialisation au demarrage
db.schema.path=sql/schema.sql
db.seed.path=sql/seed.sql
db.auto.init=false

# Identite de l'application
app.name=DentalSoft
app.version=1.0
app.groupId=ma.dentalSoft
app.cabinet=YOU SMILE
